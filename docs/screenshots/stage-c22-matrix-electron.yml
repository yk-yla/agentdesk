stage: C-22
date: 2026-08-09
kind: real-electron-bridge-sdk-matrix
viewport: 1920x1080
workspace: D:\\me\\project\\tools\\agentdesk
path: Electron renderer -> window.agentDesk -> main IPC -> Claude Worker -> Agent SDK -> controlled HTTP fixture
cleanup: each temporary Claude session closed; gateway fixture cleared after the matrix
cases:
  - kind: unauthorized
    terminal_event: claude/sdkMessage(result)
    gateway_kind: unauthorized
    status: 401
    retryable: false
    message: Claude 网关认证失败（401），请检查认证配置后重试。
    event_count: 16
  - kind: rateLimited
    terminal_event: claude/sdkMessage(result)
    gateway_kind: rateLimited
    status: 429
    retryable: true
    message: Claude 网关请求过于频繁（429），请稍后重试。
    event_count: 16
  - kind: serverError
    terminal_event: claude/sdkMessage(result)
    gateway_kind: serverError
    status: 503
    retryable: true
    message: Claude 网关服务异常（503），请稍后重试。
    event_count: 16
  - kind: truncatedSse
    terminal_event: claude/sdkMessage(result)
    gateway_kind: truncatedSse
    status: null
    retryable: true
    message: Claude 网关流式响应不完整，当前回合已结束，请重试。
    event_count: 16
  - kind: timeout
    terminal_event: claude/sdkMessage(result)
    gateway_kind: timeout
    status: null
    retryable: true
    message: 连接 Claude 网关超时，当前回合已结束，请检查网络后重试。
    event_count: 18
  - kind: offline
    terminal_event: claude/sdkMessage(result)
    gateway_kind: offline
    status: null
    retryable: true
    message: 无法连接 Claude 网关，请检查网络或网关地址后重试。
    event_count: 16
